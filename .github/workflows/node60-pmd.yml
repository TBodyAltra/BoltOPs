name: BoltOPs node60 PMD
run-name: "PMD PR #${{ inputs.pr }}"
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number (target gemm)
        required: true
        type: number
permissions:
  pull-requests: read
jobs:
  request:
    name: Queue unified node60 PMD regression
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Validate request
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ inputs.pr }}
      run: |
        set -euo pipefail
        [[ "$PR" =~ ^[1-9][0-9]*$ ]]
        gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" |
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .state == "open" and .base.ref == "gemm" and
            .head.repo.full_name == $repo and .draft == false' >/dev/null
        {
          echo "Queued unified BF16 and FP8 PMD regression for PR #$PR."
          echo "Follow the node60-pmd/gemm check on the PR for results."
        } >> "$GITHUB_STEP_SUMMARY"
