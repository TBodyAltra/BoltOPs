name: BoltOPs node60 PMD
run-name: "PMD PR #${{ inputs.pr }} ${{ inputs.mode }}"
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number (target gemm)
        required: true
        type: number
      mode:
        description: sbx2 case coverage (both modes run full shapes and grids)
        required: true
        type: choice
        options: [quick, full]
        default: quick
permissions:
  pull-requests: read
jobs:
  request:
    name: Queue node60 PMD
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Validate request
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ inputs.pr }}
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        [[ "$PR" =~ ^[1-9][0-9]*$ ]]
        case "$MODE" in
          quick|full) ;;
          *) exit 1 ;;
        esac
        gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" |
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .state == "open" and .base.ref == "gemm" and
            .head.repo.full_name == $repo and .draft == false' >/dev/null
        {
          echo "Queued PMD request for PR #$PR (BF16 and FP8, $MODE)."
          echo "Both modes use full shapes and grids on sbx2. Quick uses a smaller case set."
          echo "The node60 dispatcher reports execution and results as a commit status on the PR."
        } >> "$GITHUB_STEP_SUMMARY"
